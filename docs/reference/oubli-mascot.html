<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Oubli AI — transparent mascot overlay</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:transparent}
  #stage{position:fixed;inset:0;pointer-events:none}
  #mover{position:absolute;width:236px;height:380px;left:0;top:0;will-change:transform}
  #mover svg{width:100%;height:100%;overflow:visible;display:block}
  .speedline{
    position:absolute;height:3px;border-radius:2px;width:70px;opacity:0;
    background:linear-gradient(90deg, rgba(179,167,255,0), rgba(179,167,255,.8));
  }
  /* ---------- thought bubble ---------- */
  #obBubble{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;z-index:2}
  #obBubScale{position:relative;width:240px;height:150px;transform-origin:120px 150px;transform:scale(0);transition:transform .24s cubic-bezier(.34,1.56,.64,1)}
  #obBubScale.on{transform:scale(1)}
  #obBubBox{
    position:absolute;left:0;top:0;max-width:240px;min-width:80px;
    background:#fff;color:#1B1240;border:2.5px solid #241563;border-radius:16px;
    padding:8px 12px;font:600 13px/1.4 "Segoe UI",system-ui,sans-serif;
    box-shadow:0 4px 14px rgba(20,10,60,.25);white-space:pre-wrap;word-break:break-word;
  }
  #obCaret{display:inline-block;width:2px;height:13px;background:#5B40F2;margin-left:1px;vertical-align:-2px;animation:obBlink 1s steps(1) infinite}
  @keyframes obBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
  .obDot{position:absolute;border-radius:50%;background:#fff;border:2.5px solid #241563}
</style>
</head>
<body>
<div id="stage">
  <div id="obBubble">
    <div id="obBubScale">
      <div id="obBubBox"><span id="obBubTxt"></span><span id="obCaret"></span></div>
      <div class="obDot" style="width:16px;height:16px;left:100px;top:0"></div>
      <div class="obDot" style="width:9px;height:9px;left:112px;top:0"></div>
    </div>
  </div>
  <div id="mover">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 485 780" width="100%" height="100%" role="img" aria-labelledby="ob-title ob-desc">
<!--
  Oubli AI mascot. Self-contained: pure CSS keyframes, no JS, no external fonts or images.
  No background layer: everything outside the character is transparent.
  Default size is 194x312 (0.4x); it is vector, so set any width/height you like. The canvas is
  trimmed to the animation's reach (hop, flapping arms, pop-ups) so nothing clips.
  Animates inline or as <img src>. Every id/class is prefixed "ob-" so it can be inlined safely.
  Rig: nested <g> groups, each with one animated transform; pivots are transform-origin in viewBox units.
  .ob-m / .ob-s share a 20s timeline (1% = 0.2s); idle loops (breathe, blink, antenna, ear) run on their own periods.
  The shirt print is the supplied Oubli logo, embedded as a transparent PNG (data URI).
  The "?" and "hic!" pop-ups are outlined Fredoka One glyphs (SIL OFL 1.1).
-->
<title id="ob-title">Oubli AI mascot</title>
<desc id="ob-desc">A chubby royal-blurple robot buddy with a screen face, googly eyes and a springy antenna, wearing a too-small black Oubli T-shirt and big yellow sneakers. He breathes, blinks, waves, flaps at his antenna, jumps, belly-laughs himself into a hiccup and winks.</desc>

<style>

/* shared 20s "story" timeline: 1% = 0.2s */
.ob-m{animation-duration:20s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.ob-s{animation-duration:20s;animation-timing-function:step-end;animation-iteration-count:infinite}

const deckLights = [...mover.querySelectorAll('.obDl')];

const bub = document.getElementById('obBubble'),
      bubScale = document.getElementById('obBubScale'),
      bubBox = document.getElementById('obBubBox'),
      bubTxt = document.getElementById('obBubTxt'),
      bubDots = [...bub.querySelectorAll('.obDot')];
const B = { shown: false, shownTxt: '', target: '', typed: 0, typeT: 0, hideT: 0, queue: [] };
const idleThoughts = [
  'beep… boop… jk.', 'wonder if anyone can catch me', 'my antenna itches',

function bubShow(text) {
  if (!text) return;
  if (B.shown && B.shownTxt === text) { B.hideT = S.t + 6; return; } // refresh lifetime
  if (B.shown) { B.hideT = 0; } // replace
  B.shown = true; B.shownTxt = text; B.target = text; B.typed = 0; B.typeT = 0;
  B.hideT = S.t + Math.max(5, text.length * .09 + 3);
  bubScale.classList.add('on');
}
function bubHide() { B.shown = false; B.shownTxt = ''; bubScale.classList.remove('on'); }
function bubType(dt) {
  if (!B.shown) return;
  if (B.typed < B.target.length) {
    B.typeT += dt;
    const n = Math.floor(B.typeT * 34);  // ~34 chars/sec
    if (n > 0) { B.typed = Math.min(B.target.length, B.typed + n); B.typeT -= n / 34; bubTxt.textContent = B.target.slice(0, B.typed); }
  } else if (S.t > B.hideT) bubHide();
}
setInterval(() => {  // he mutters to himself when idle
  if (S.caught || S.work || S.moon || S.speaking || S.thinking || B.shown) return;
  if (Math.random() < .25) bubShow(idleThoughts[Math.floor(Math.random() * idleThoughts.length)]);

const visScale = n => vis[n].querySelector('.obVisScale');

/* speed lines */

/* ---------- state ---------- */
const S = {
  x: innerWidth * .5, vx: 0, facing: 1, t: 0, last: performance.now(),
  work: false, moon: false, moonDir: 1, fleeing: false, fleeEnabled: true,
  open: 0, openT: 0, viseme: 'AH', visHold: 0, speaking: false,
  wanderX: innerWidth * .5, wanderT: 0, hopT: -9, lap: 0,
  caught: false, catchT: 0, alt: 0, vy: 0, landT: -9, swing: 0,
  genre: null, musicOn: false, bpm: 90, beat: 0, beatFlash: 0, bass: 0, energy: 0,
  extFreq: null,          // () => Uint8Array  (e.g. ElevenLabs getOutputByteFrequencyData)
  extVol: null,           // () => 0..1        (e.g. ElevenLabs getOutputVolume)
  analyser: null
};
let W = innerWidth, H = innerHeight;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; });

let cx = -9999, cy = -9999, lastMove = 0, cvx = 0, cvy = 0, pcx = -9999, pcy = -9999, pct = 0;
function updCursor(x, y) {
  const now = performance.now(), d = Math.max(1, now - pct) / 1000;
  if (pct) { cvx = (x - pcx) / d; cvy = (y - pcy) / d; }
  pcx = x; pcy = y; pct = now; cx = x; cy = y; lastMove = S.t;
}
addEventListener('pointermove', e => updCursor(e.clientX, e.clientY));

const floorTop = () => H - 380 - Math.max(8, H * .02);

/* ---------- audio analysis -> viseme ---------- */
let AC, analyser, freqBuf;
function ensureAC() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); analyser = AC.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .55; freqBuf = new Uint8Array(analyser.frequencyBinCount); }
  if (AC.state === 'suspended') AC.resume();
}
function bands(freq) {
  // assume 16k-48k sample rate; map bins to Hz
  const hz = AC ? AC.sampleRate / analyser.fftSize : 48000 / 1024;
  const sum = (a, b) => { let s = 0; const i0 = Math.max(1, Math.floor(a / hz)), i1 = Math.min(freq.length - 1, Math.ceil(b / hz)); for (let i = i0; i <= i1; i++) s += freq[i]; return s / Math.max(1, i1 - i0 + 1); };
  return { low: sum(85, 500), mid: sum(500, 2200), high: sum(2200, 6000) };
}
function analyseFrame(freq) {
  const b = bands(freq);
  const total = b.low + b.mid + b.high + 1e-6;
  const openRaw = Math.min(1, (b.low + b.mid * 1.4 + b.high * .8) / 300);
  // vowel color: rounded (oo/oh) when lows dominate, wide (ee/fricative) when highs dominate
  if (openRaw < .05) return { open: 0, vis: 'AH' };
  const lowR = b.low / total, highR = b.high / total;
  const vis = (lowR > .55 && highR < .18) ? 'O' : (highR > .30 && lowR < .35) ? 'EE' : 'AH';
  return { open: openRaw, vis };
}

/* ---------- Gemini Live / Strands Bidi PCM path ----------
   Output from GoogleGeminiLiveModel is 16-bit mono PCM at fixed 24kHz, ~40ms chunks.
   feedPcm() schedules gapless playback AND taps the same graph through an analyser,
   so the visemes track exactly what the listener hears, with zero clock drift. */
let pcmNext = 0, pcmSrcs = [], pcmOut = false;
function feedPcm(data, rate) {
  ensureAC();
  rate = rate || 24000;
  const f = new Float32Array(data.length);
  for (let i = 0; i < data.length; i++) f[i] = data[i] / 32768;
  const buf = AC.createBuffer(1, f.length, rate);
  buf.getChannelData(0).set(f);
  if (!pcmOut) { analyser.connect(AC.destination); pcmOut = true; }
  const src = AC.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  const t0 = Math.max(AC.currentTime + .015, pcmNext);
  src.start(t0);
  pcmNext = t0 + buf.duration;
  pcmSrcs.push(src);
  src.onended = () => { pcmSrcs = pcmSrcs.filter(s => s !== src); };
  S.pcmMode = true;
}
function flushAudio() {  // barge-in: Gemini stopped talking, stop sound + mouth NOW
  pcmSrcs.forEach(s => { try { s.stop(); } catch (e) {} });
  pcmSrcs = []; pcmNext = 0;
}
function b64ToI16(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Int16Array(u.buffer);
}

/* external audio sources */
let extStreamSrc = null;
function attachStream(stream) {
  ensureAC();
  if (extStreamSrc) extStreamSrc.disconnect();
  extStreamSrc = AC.createMediaStreamSource(stream);
  extStreamSrc.connect(analyser);
  S.analyser = analyser; S.speaking = true;
}
function attachAudioElement(el) {
  ensureAC();
  if (extStreamSrc) extStreamSrc.disconnect();
  extStreamSrc = AC.createMediaElementSource(el);
  extStreamSrc.connect(analyser);
  analyser.connect(AC.destination);
  S.analyser = analyser; S.speaking = true;
}
async function attachMic() {
  try { attachStream(await navigator.mediaDevices.getUserMedia({ audio: true })); } catch (e) {}
}

/* browser-TTS demo voice (fallback when no ElevenLabs) */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text || "Hello! I am Oubli. Plug me into an Eleven Labs agent and my mouth will match every syllable.");
  u.rate = 1.05; u.pitch = 1.25;
  u.onboundary = () => { S.openT = .5 + Math.random() * .5; };
  S.speaking = true;
  const maxT = setTimeout(() => { if (!S.extFreq && !S.analyser) S.speaking = false; }, u.text.length * 90 + 1500);
  u.onend = u.onerror = () => { if (!S.extFreq && !S.analyser) S.speaking = false; clearTimeout(maxT); };
  speechSynthesis.speak(u);
  const iv = setInterval(() => {
    if (!S.speaking || S.extFreq || S.analyser) { clearInterval(iv); return; }
    if (Math.random() < .8) S.openT = Math.max(S.openT, .25 + Math.random() * .6);
  }, 160);
}

/* ---------- public API + postMessage bridge ---------- */
window.Oubli = {
  work: on => { S.work = on === undefined ? !S.work : !!on; if (S.work) S.moon = false; },
  moonwalk: on => { S.moon = on === undefined ? !S.moon : !!on; if (S.moon) { S.work = false; S.moonDir = S.facing; } },
  speak, attachStream, attachAudioElement, attachMic,
  setSpeaking: on => { S.speaking = !!on; },
  feedPcm, flushAudio,
  setThinking: on => { S.thinking = !!on; },
  bubble: (text, hold) => { bubShow(text); if (hold) B.hideT = S.t + hold; },
  bubbleHide: () => bubHide(),
  /* ----- music mode (Live Music API / Lyria RealTime) ----- */
  genre: g => { S.genre = g || null; S.musicOn = !!g; if (g) { S.work = false; S.moon = false; } },
  feedMusic: (b64, rate) => feedPcm(b64ToI16(b64), rate || 44100),
  setBpm: b => { S.bpm = +b || 90; },
  musicStop: () => { S.genre = null; S.musicOn = false; flushAudio(); },
  setFlee: on => { S.fleeEnabled = !!on; },
  setCursor: (x, y) => updCursor(x, y),
  setPosition: fx => { S.wanderX = S.x = Math.max(130, Math.min(W - 130, fx * W)); },
  /* ElevenLabs: pass the conversation-controls object (or anything exposing
     getOutputByteFrequencyData / getOutputVolume). Mouth then follows the agent audio. */
  lipSync: src => {
    if (typeof src === 'function') { S.extFreq = src; S.speaking = true; return; }
    if (src && src.getOutputByteFrequencyData) {
      S.extFreq = () => { const a = src.getOutputByteFrequencyData(); return a && a.length ? a : null; };
      if (src.getOutputVolume) S.extVol = () => src.getOutputVolume();
      S.speaking = true;
    }
  }
};
addEventListener('message', e => {
  const m = e.data || {};
  if (m.ob === 'work') window.Oubli.work(m.on);
  if (m.ob === 'moonwalk') window.Oubli.moonwalk(m.on);
  if (m.ob === 'speak') speak(m.text);
  if (m.ob === 'cursor') window.Oubli.setCursor(m.x, m.y);
  if (m.ob === 'flee') window.Oubli.setFlee(m.on);
  if (m.ob === 'thinking') window.Oubli.setThinking(m.on);
  /* Strands Bidi / Gemini Live: forward each output audio chunk as base64 PCM */
  if (m.ob === 'pcm' && m.b64) feedPcm(b64ToI16(m.b64), m.rate || 24000);
  if (m.ob === 'flush') flushAudio();
  if (m.ob === 'bubble' && m.text) window.Oubli.bubble(m.text, m.hold);
  if (m.ob === 'bubbleHide') bubHide();
  /* Gemini 3.8 Live Extended Thinking lifecycle:
     turnComplete:true + interactionStatus IN_PROGRESS => reasoning/tool-call phase (thinking face)
     turnComplete:true + interactionStatus IDLE        => fully done
     interrupted                                        => barge-in: stop sound + mouth */
  if (m.ob === 'interaction') {
    if (m.status === 'IN_PROGRESS') window.Oubli.setThinking(true);
    if (m.status === 'IDLE') { window.Oubli.setThinking(false); }
    if (m.interrupted) { flushAudio(); window.Oubli.setThinking(false); }
  }
  /* Live Music API: genre select + audio chunks + bpm */
  if (m.ob === 'genre') window.Oubli.genre(m.g);
  if (m.ob === 'music' && m.b64) { if (m.bpm) S.bpm = m.bpm; window.Oubli.feedMusic(m.b64, m.rate); }
  if (m.ob === 'musicStop') window.Oubli.musicStop();
  /* word-level alignment from outputAudioTranscription (wordTimestamp:true):
     pop the mouth for each spoken word, timed to the word, not just the waveform */
  if (m.ob === 'words' && Array.isArray(m.data)) {
    S.wordQueue = (S.wordQueue || []).concat(m.data.map(w => ({ t: S.t + (w.delay || 0), open: .5 + Math.random() * .45, hold: .14 + (w.text ? w.text.length * .02 : .1) })));
  }
  /* host pumps ElevenLabs getOutputByteFrequencyData() frames at ~30-60fps */
  if (m.ob === 'freq' && Array.isArray(m.data)) { S.msgFreq = { data: Uint8Array.from(m.data), t: S.t }; S.speaking = true; }
  /* or host-side viseme decision: {ob:'mouth', open:0..1, vis:'AH'|'O'|'EE'} */
  if (m.ob === 'mouth') { S.msgMouth = { open: +m.open || 0, vis: ['AH','O','EE'].includes(m.vis) ? m.vis : 'AH', t: S.t }; S.speaking = true; }
});

/* code flicker while working */
setInterval(() => {
  if (!S.work) return;
  [...code.children].forEach(r => {
    if (r.id === 'obCursor') { r.setAttribute('opacity', Math.random() < .5 ? 1 : 0); return; }
    r.setAttribute('width', 14 + Math.random() * 58);
    r.setAttribute('opacity', .45 + Math.random() * .55);
  });
}, 150);

/* ---------- main loop ---------- */
function frame(now) {
  const dt = Math.min(.05, (now - S.last) / 1000); S.last = now; S.t += dt;
  const t = S.t, fy = floorTop();

  /* flee */
  const faceY = fy + 150, distC = Math.hypot(cx - S.x, cy - faceY);
  const mouseActive = (t - lastMove) < 2.5;
  if (!S.caught && S.fleeEnabled && mouseActive && distC < 180) S.fleeing = true;
  else if (distC > 300 || !mouseActive) S.fleeing = false;

  /* ---------- grab: the cursor catches him ---------- */
  const curSpeed = Math.hypot(cvx, cvy);
  if (!S.caught && mouseActive && distC < 90) {
    S.caught = true; S.catchT = t; S.fleeing = false; S.work = false; S.moon = false;
  }
  if (S.caught) {
    // held: he is physically lifted — his feet sit at the cursor, wherever it goes
    S.x += (cx - S.x) * Math.min(1, dt * 18);
    S.alt += (Math.max(0, fy - cy) - S.alt) * Math.min(1, dt * 14);
    S.vx = cvx * .008;
    // pendulum swing driven by cursor velocity + his own struggling
    const swingTarget = Math.max(-22, Math.min(22, cvx * .02)) + Math.sin(t * 7.5) * 7;
    S.swing += (swingTarget - S.swing) * Math.min(1, dt * 6);
    // escape: he wriggles free after ~3s, or a fast flick throws him
    if (t - S.catchT > 3 || curSpeed > 2600) {
      S.caught = false;
      S.vx = Math.max(-14, Math.min(14, cvx * .012));
      S.vy = Math.max(-10, Math.min(16, -cvy * .012));
    }
  }
  /* airborne physics after a throw */
  if (!S.caught && (S.alt > 0 || S.vy !== 0)) {
    S.alt += S.vy * 60 * dt; S.vy -= 30 * dt;
    if (S.alt <= 0) { S.alt = 0; if (S.vy < -4) S.landT = t; S.vy = 0; }
  }

  /* idle wander */
  if (!S.fleeing && !S.moon && !S.work) {
    S.wanderT -= dt;
    if (S.wanderT <= 0) { S.wanderX = 150 + Math.random() * (W - 300); S.wanderT = 7 + Math.random() * 9; }
  }

  /* locomotion */
  if (S.caught) { /* position driven by the cursor above */ }
  else if (S.fleeing) {
    const dir = (S.x - cx) / (distC || 1);
    S.vx = Math.max(-7.5, Math.min(7.5, S.vx + dir * 90 * dt));
  } else if (S.moon) {
    S.vx += (S.moonDir * 1.9 - S.vx) * Math.min(1, dt * 6);
  } else if (!S.work) {
    S.vx += (Math.sign(S.wanderX - S.x) * .7 - S.vx) * Math.min(1, dt * 2);
    if (Math.abs(S.wanderX - S.x) < 30) S.vx *= Math.pow(.001, dt);
  } else {
    S.vx *= Math.pow(.001, dt);
  }
  S.x += S.vx * 60 * dt;
  if (S.x < 130) { S.x = 130; if (S.moon) S.moonDir = 1; S.vx = Math.abs(S.vx) * .4; }
  if (S.x > W - 130) { S.x = W - 130; if (S.moon) S.moonDir = -1; S.vx = -Math.abs(S.vx) * .4; }

  const running = S.fleeing && Math.abs(S.vx) > .6;
  const gliding = S.moon && !running;
  if (Math.abs(S.vx) > .4) S.facing = S.vx > 0 ? 1 : -1;
  if (gliding) S.facing = -S.moonDir;
  flip.style.transform = S.facing === -1 ? 'translate(485px,0px) scale(-1,1)' : '';
  const dangle = S.caught ? S.swing * Math.min(1, (t - S.catchT) * 4) : 0;
  mover.style.transform = `translate(${S.x - 118}px, ${fy - S.alt}px) rotate(${dangle}deg)`;

  /* ---------- lip sync ---------- */
  /* PCM queue drains as it plays: speaking state follows the playback clock,
     so Extended Thinking pauses and barge-ins close the mouth instantly */
  if (S.pcmMode && AC) S.speaking = pcmNext > AC.currentTime + .01;

  /* thought bubble: type + follow + squash */
  bubType(dt);
  if (B.shown || bubScale.classList.contains('on')) {
    const w = bubBox.offsetWidth || 120, h = bubBox.offsetHeight || 34;
    bubBox.style.left = (120 - w / 2) + 'px'; bubBox.style.top = (132 - h) + 'px';
    bubDots[0].style.top = (132 + 4) + 'px'; bubDots[0].style.left = (96) + 'px';
    bubDots[1].style.top = (132 + 24) + 'px'; bubDots[1].style.left = (112) + 'px';
    const bx = Math.max(135, Math.min(W - 135, S.x));
    const by = Math.max(215, fy - S.alt - 322);
    bub.style.transform = `translate(${bx - 120}px, ${by - 150}px) rotate(${dangle * .4}deg)`;
  }

  let openTarget = 0, visPick = S.viseme;
  if (S.msgMouth && t - S.msgMouth.t < .15) {
    openTarget = S.msgMouth.open; visPick = S.msgMouth.vis;
  } else if (S.msgFreq && t - S.msgFreq.t < .15) {
    const r = analyseFrame(S.msgFreq.data); openTarget = r.open; visPick = r.vis;
  } else if (S.pcmMode) {
    if (S.speaking) {
      analyser.getByteFrequencyData(freqBuf);
      const r = analyseFrame(freqBuf); openTarget = r.open; visPick = r.vis;
      /* word-timestamp events sharpen the opening envelope: fire a pulse per word */
      if (S.wordQueue) {
        while (S.wordQueue.length && S.wordQueue[0].t <= S.t) {
          const w = S.wordQueue.shift();
          S.openT = Math.max(S.openT, w.open); S.openHold = S.t + w.hold;
        }
      }
      if (S.openHold && S.t < S.openHold) openTarget = Math.max(openTarget, S.openT || 0);
    }
  } else if (S.extFreq) {
    const f = S.extFreq();
    if (f) { const r = analyseFrame(f); openTarget = r.open; visPick = r.vis; }
  } else if (S.analyser && S.speaking) {
    analyser.getByteFrequencyData(freqBuf);
    const r = analyseFrame(freqBuf); openTarget = r.open; visPick = r.vis;
  } else if (S.speaking) {
    S.openT *= Math.pow(.02, dt);
    openTarget = S.openT; visPick = Math.sin(t * 9) > .4 ? 'O' : (Math.sin(t * 13) < -.5 ? 'EE' : 'AH');
  }
  // viseme switching with min-hold (natural merge, avoids machine-gun flicker)
  S.visHold -= dt * 1000;
  if (visPick !== S.viseme && S.visHold <= 0) { S.viseme = visPick; S.visHold = 70; }
  S.open += (openTarget - S.open) * Math.min(1, dt * 24);
  const open = S.open, mouthOn = open > .05;

  Object.keys(vis).forEach(k => { vis[k].setAttribute('opacity', mouthOn && k === S.viseme ? 1 : 0); });
  if (mouthOn) {
    const sy = .1 + open * 1.2, sx = .85 + open * .3;
    const g = visScale(S.viseme);
    g.style.transform = `scale(${sx},${sy})`;
    g.style.transformOrigin = '320px 364px'; g.style.transformBox = 'view-box';
  }
  E['ob-vSmile'].style.opacity = mouthOn ? 0 : 1;

  /* concerned face while caught: wavy mouth + worried brows */
  const worried = S.caught;
  E['ob-vBrowW'].style.opacity = worried ? 1 : 0;
  E['ob-vWavy'].style.opacity = worried ? 1 : 0;
  if (worried) {
    E['ob-vSmile'].style.opacity = 0;
    Object.keys(vis).forEach(k => vis[k].setAttribute('opacity', 0));
  }

  /* ---------- music (Live Music API) ---------- */
  Object.keys(props).forEach(k => { if (props[k]) props[k].setAttribute('opacity', S.genre === k ? 1 : 0); });
  if (S.musicOn && S.speaking) {  // 'speaking' doubles as "audio playing" via feedMusic
    analyser.getByteFrequencyData(freqBuf);
    const b = bands(freqBuf);
    S.bass += (Math.min(1, b.low / 200) - S.bass) * Math.min(1, dt * 14);
    S.energy += (Math.min(1, (b.low + b.mid + b.high) / 450) - S.energy) * Math.min(1, dt * 8);
    // beat clock from the provided bpm + a bass flash
    S.beat += dt * (S.bpm / 60);
    const frac = S.beat % 1;
    S.beatFlash = Math.max(Math.exp(-frac * 6) * S.bass, 0);
  } else { S.bass *= .9; S.energy *= .9; S.beatFlash = 0; }

  /* ---------- pose ---------- */
  let jumpY = 0, sqX = 1, sqY = 1, lean = 0, headY = 0, headR = 0;
  let armL = 0, armR = 0, handL = 0, handR = 0, footL = 'translate(0px,0px) rotate(0deg)', footR = footL;

  if (S.musicOn && S.genre) {
    const beat = S.beat, e = S.energy, fl = S.beatFlash;
    if (S.genre === 'electronic') {
      jumpY = -6 * Math.abs(Math.sin(Math.PI * beat)) * (.4 + e);
      headY = 6 * Math.sin(Math.PI * beat) * (.4 + e);
      headR = 7 * Math.sin(Math.PI * beat * .5);
      armR = -38 + 24 * Math.sin(Math.PI * beat);   // hand riding the platter
      armL = -24 + 10 * Math.sin(Math.PI * beat * 2);
      platter.style.transform = `rotate(${t * 210}deg)`; platter.style.transformOrigin = '252px 648px'; platter.style.transformBox = 'view-box';
      platter2.style.transform = `rotate(${-t * 260}deg)`; platter2.style.transformOrigin = '388px 648px'; platter2.style.transformBox = 'view-box';
      deckLights.forEach((c, i) => c.setAttribute('opacity', .15 + .85 * (Math.abs(Math.sin(t * (S.bpm / 60) * Math.PI + i)) * (0.3 + fl))));
    } else if (S.genre === 'country') {
      lean = 5 * Math.sin(Math.PI * beat * .5); jumpY = -4 * Math.abs(Math.sin(Math.PI * beat)) * e;
      armR = 40 + 26 * Math.sin(Math.PI * beat * 2);  // strumming
      headR = 6 * Math.sin(Math.PI * beat * .5);
    } else if (S.genre === 'rock') {
      headY = 12 * Math.sin(Math.PI * beat * 2) * (.5 + e); headR = 12 * Math.sin(Math.PI * beat * 2);
      lean = -8 + 6 * Math.sin(Math.PI * beat); jumpY = -8 * Math.abs(Math.sin(Math.PI * beat)) * e;
      armR = 50 + 30 * Math.sin(Math.PI * beat * 2);
    } else if (S.genre === 'pop') {
      jumpY = -5 * Math.abs(Math.sin(Math.PI * beat)) * e;
      lean = 6 * Math.sin(Math.PI * beat * .5);
      armL = -50; armR = -50;   // both hands at the mic
      headY = 3 * Math.sin(Math.PI * beat);
    } else if (S.genre === 'rap') {
      jumpY = -7 * Math.abs(Math.sin(Math.PI * beat)) * (.4 + e);
      lean = 7 * Math.sin(Math.PI * beat * .5);
      armR = -30 + 40 * Math.sin(Math.PI * beat);  // bouncing hand
      headR = 8 * Math.sin(Math.PI * beat);
    } else if (S.genre === 'classical') {
      lean = 4 * Math.sin(Math.PI * beat * .5);
      armR = -70 + 55 * Math.sin(Math.PI * beat); armL = -70 + 55 * Math.sin(Math.PI * beat + Math.PI * .5);
      headY = 3 * Math.sin(Math.PI * beat);
    }
    sqY = 1 + .04 * fl; sqX = 2 - sqY;   // pulse on the beat
  } else if (S.caught) {
    const p = t * 21;                          // frantic flailing, the whole time he's held
    const s = Math.sin(p), c = Math.cos(p * .9);
    jumpY = 6 * Math.sin(p * 2);
    lean = 10 * c;
    sqX = 1 + .05 * s; sqY = 1 - .05 * s;
    armL = -70 + 65 * s; armR = 70 - 65 * s;   // windmilling arms
    handL = 32 * c; handR = -32 * c;
    footL = `translate(${8 * c}px,${-16 * Math.max(0, s)}px) rotate(${44 * s}deg)`;
    footR = `translate(${-8 * c}px,${-16 * Math.max(0, -s)}px) rotate(${-44 * s}deg)`;
    headY = 4; headR = 9 * Math.sin(t * 13);   // shaking his head "no no no"
  } else if (running) {
    const p = t * 17;
    jumpY = -7 * Math.abs(Math.sin(p)); lean = S.facing * 11;
    sqX = 1 + .03 * Math.sin(p * 2); sqY = 1 - .03 * Math.sin(p * 2);
    const s = Math.sin(p);
    footL = `translate(${-S.facing * 10 * s}px,${-14 * Math.max(0, -s)}px) rotate(${30 * s}deg)`;
    footR = `translate(${S.facing * 10 * s}px,${-14 * Math.max(0, s)}px) rotate(${-30 * s}deg)`;
    armL = 42 * s; armR = -42 * s; handL = 14 * s; handR = -14 * s;
    headY = 3; headR = -S.facing * 4;
  } else if (gliding) {
    const p = t * 4.6, s = Math.sin(p), s2 = Math.sin(p + Math.PI);
    jumpY = -3.5 * Math.abs(Math.sin(p)); lean = -S.moonDir * 7;
    footL = `translate(${S.moonDir * 22 * Math.max(0, s)}px,${-15 * Math.max(0, -s)}px) rotate(${-26 * Math.max(0, -s)}deg)`;
    footR = `translate(${S.moonDir * 22 * Math.max(0, s2)}px,${-15 * Math.max(0, -s2)}px) rotate(${-26 * Math.max(0, -s2)}deg)`;
    armL = -17 * s; armR = 17 * s; headR = -S.moonDir * 5; headY = 2 * Math.sin(p * 2);
    sqY = 1 + .012 * Math.sin(p * 2); sqX = 2 - sqY;
  } else if (S.work) {
    const p = t * 24;
    armL = -46 + Math.sin(p) * 4; armR = 46 + Math.sin(p + Math.PI) * 4;
    handL = Math.sin(p) * 11; handR = Math.sin(p + Math.PI) * 11;
    headY = 5 + Math.sin(t * 2.2) * 1.2; headR = Math.sin(t * 1.3) * 1.5;
    lean = Math.sin(t * .8) * .8;
  } else {
    if (t - S.hopT > 6 + Math.random() * 3) S.hopT = t;
    const hp = (t - S.hopT) / .55;
    if (hp < 1) { jumpY = -36 * Math.sin(Math.PI * hp); sqY = 1 + .06 * Math.sin(Math.PI * hp); sqX = 2 - sqY; }
    lean = Math.sin(t * .6) * 1.6;
    armL = Math.sin(t * .9) * 4; armR = -Math.sin(t * .9 + .5) * 4;
    headR = Math.sin(t * .5) * 2;
  }

  /* landing squash after a throw */
  const lt = (t - S.landT) / .3;
  if (lt >= 0 && lt < 1 && !S.caught) { const k = Math.sin(lt * Math.PI); sqY *= 1 - .16 * k; sqX *= 1 + .12 * k; }

  setT(E['ob-jump'], `translate(0px,${jumpY}px)`);
  setT(E['ob-squash'], `scale(${sqX},${sqY})`, 320, 730);
  setT(E['ob-lean'], `rotate(${lean}deg)`, 320, 730);
  /* shadow: shrinks + fades with altitude so the lift reads clearly */
  const altK = Math.min(1, S.alt / 420);
  setT(E['ob-shadow'], `scale(${(1 - jumpY / 220) * (1 - altK * .55)})`, 320, 735);
  E['ob-shadow'].style.opacity = 1 - altK * .65;
  setT(E['ob-headfollow'], `translate(0px,${headY + open * 3}px)`);
  setT(E['ob-headtilt'], `rotate(${headR + Math.sin(t * 7) * 2.5 * open}deg)`, 320, 460);
  setT(E['ob-armL'], `rotate(${armL}deg)`, 220, 492);
  setT(E['ob-armR'], `rotate(${armR}deg)`, 420, 492);
  setT(E['ob-handL'], `rotate(${handL}deg)`, 220, 578);
  setT(E['ob-handR'], `rotate(${handR}deg)`, 420, 578);
  setT(E['ob-footL'], footL, 288, 690);
  setT(E['ob-footR'], footR, 352, 690);

  /* laptop */
  S.lap += ((S.work ? 1 : 0) - S.lap) * Math.min(1, dt * 7);
  const sc = Math.max(.001, S.lap * (1 + .18 * Math.sin(Math.min(1, S.lap) * Math.PI)));
  laptop.style.opacity = S.lap > .02 ? 1 : 0;
  laptop.style.transform = `scale(${sc})`;
  laptop.style.transformOrigin = '320px 560px'; laptop.style.transformBox = 'view-box';

  /* sweat + pupils */
  /* thinking (Gemini Extended Thinking pauses): antenna bulb pulses, eyes glance up */
  if (S.thinking && !S.caught) {
    const pulse = .25 + .75 * Math.abs(Math.sin(t * 3.2));
    bulbOn.forEach(el => el.setAttribute('opacity', pulse));
  } else {
    bulbOn.forEach(el => el.setAttribute('opacity', 1));
  }
  E['ob-sweat'].style.opacity = (running || S.caught) ? 1 : 0;
  if (S.caught) {
    const dx = Math.sin(t * 17) * 7, dy = 4 + Math.cos(t * 15) * 3;
    const pL = E['ob-pupilL'].parentElement, pR = E['ob-pupilR'].parentElement; // ob-pshock wrappers
    setT(pL, 'scale(.68)', 268, 331);
    setT(pR, 'scale(.68)', 372, 335);
    setT(E['ob-pupilL'], `translate(${dx}px,${dy}px)`);
    setT(E['ob-pupilR'], `translate(${dx * .8}px,${dy * .8}px)`);
  } else if (S.thinking) {
    setT(E['ob-pupilL'].parentElement, 'scale(1)');
    setT(E['ob-pupilR'].parentElement, 'scale(1)');
    const glance = Math.sin(t * .7) * 4;
    setT(E['ob-pupilL'], `translate(${glance}px,-9px)`);
    setT(E['ob-pupilR'], `translate(${glance * .8}px,-9px)`);
  } else if (!S.work) {
    setT(E['ob-pupilL'].parentElement, 'scale(1)');
    setT(E['ob-pupilR'].parentElement, 'scale(1)');
    const dx = Math.max(-9, Math.min(9, (cx - S.x) / 26)) * S.facing;
    const dy = Math.max(-8, Math.min(9, (cy - faceY) / 34));
    setT(E['ob-pupilL'], `translate(${dx}px,${dy}px)`);
    setT(E['ob-pupilR'], `translate(${dx * .8}px,${dy * .8}px)`);
  } else {
    setT(E['ob-pupilL'], 'translate(-3px,9px)');
    setT(E['ob-pupilR'], 'translate(-1px,9px)');
  }

  /* speed lines */
  lines.forEach((d, i) => {
    const on = running && Math.abs(S.vx) > 2;
    d.style.opacity = on ? Math.min(1, Math.abs(S.vx) / 6) * (1 - i * .25) : 0;
    if (on) {
      const bx = S.facing === 1 ? S.x - 150 : S.x + 80;
      d.style.transform = `translate(${bx}px, ${fy + 120 + i * 80 + Math.sin(t * 20 + i) * 8}px) scaleX(${S.facing})`;
    }
  });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
