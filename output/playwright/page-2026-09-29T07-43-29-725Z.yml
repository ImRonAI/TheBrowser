              - paragraph [ref=e1066]: "Agent SOPs use a standardized markdown format with key features that enable repeatable and understandable behavior from AI agents:"
              - list [ref=e1067]:
                - listitem [ref=e1068]:
                  - strong [ref=e1069]:
                    - text: Structured steps with
