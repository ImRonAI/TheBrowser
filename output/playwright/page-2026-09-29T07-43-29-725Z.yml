                    - /url: https://datatracker.ietf.org/doc/html/rfc2119
                  - text: keywords like MUST, SHOULD, and MAY to provide precise control over agent behavior without rigid scripting, ensuring reliable execution while preserving the agent's reasoning ability.
                - listitem [ref=e1072]:
                  - strong [ref=e1073]: Parameterized inputs
                  - text: "- Rather than hardcoding specific values, SOPs accept parameters that customize behavior for different projects, teams, or requirements. This transforms single-use prompts into flexible templates that can be applied broadly while maintaining consistency."
                - listitem [ref=e1074]:
                  - strong [ref=e1075]: Easy authoring through AI assistance
                  - text: "- Teams can create new SOPs in minutes. Coding agents can read the SOP format specification and generate new workflows based on natural language descriptions, making the creation process accessible to anyone regardless of prompt engineering expertise."
